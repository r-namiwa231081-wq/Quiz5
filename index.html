    // ==========================================
    // 1.5 - 1.6 問題生成ロジック (AIの大改修！)
    // ==========================================
    const generateMathQuestion = (grade) => {
      let q = ""; let correct = 0;
      const rand = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
      if (grade === 'g1_2') {
        const type = rand(1, 3);
        if (type === 1) { const a = rand(1, 20); const b = rand(1, 20); q = `${a} + ${b} = ?`; correct = a + b; } 
        else if (type === 2) { const a = rand(10, 30); const b = rand(1, a); q = `${a} - ${b} = ?`; correct = a - b; } 
        else { const a = rand(1, 9); const b = rand(1, 9); q = `${a} × ${b} = ?`; correct = a * b; }
      } else if (grade === 'g3') {
        const type = rand(1, 3);
        if (type === 1) { const a = rand(10, 99); const b = rand(10, 99); q = `${a} + ${b} = ?`; correct = a + b; } 
        else if (type === 2) { const a = rand(20, 99); const b = rand(10, a); q = `${a} - ${b} = ?`; correct = a - b; } 
        else { const a = rand(10, 99); const b = rand(2, 9); q = `${a} × ${b} = ?`; correct = a * b; }
      } else if (grade === 'g4') {
         const type = rand(1, 3);
        if (type === 1) { const a = rand(100, 999); const b = rand(100, 999); q = `${a} + ${b} = ?`; correct = a + b; } 
        else if (type === 2) { const a = rand(100, 999); const b = rand(10, a); q = `${a} - ${b} = ?`; correct = a - b; } 
        else { const b = rand(2, 9); const ans = rand(11, 50); const a = b * ans; q = `${a} ÷ ${b} = ?`; correct = ans; }
      } else if (grade === 'g5') {
         const type = rand(1, 3);
        if (type === 1) { const a = (rand(1, 99) / 10).toFixed(1); const b = (rand(1, 99) / 10).toFixed(1); q = `${a} + ${b} = ?`; correct = (parseFloat(a) + parseFloat(b)).toFixed(1); } 
        else if (type === 2) { const a = (rand(11, 99) / 10).toFixed(1); const b = (rand(1, 10) / 10).toFixed(1); q = `${a} - ${b} = ?`; correct = (parseFloat(a) - parseFloat(b)).toFixed(1); } 
        else { const a = rand(11, 50); const b = rand(2, 9); q = `${a} × ${b} = ?`; correct = a * b; }
      }

      const isFloat = typeof correct === 'string' && correct.includes('.');
      const cNum = isFloat ? parseFloat(correct) : correct;
      let dummies = new Set();
      while(dummies.size < 3) {
        let dummy;
        if (isFloat) { let diff = (rand(1, 20) / 10) * (rand(0, 1) === 0 ? 1 : -1); if (diff === 0) diff = 1.0; dummy = (cNum + diff).toFixed(1); } 
        else { let diff = rand(1, 10) * (rand(0, 1) === 0 ? 1 : -1); if (diff === 0) diff = 1; dummy = cNum + diff; }
        if (dummy != correct && dummy > 0) dummies.add(String(dummy));
      }
      const dummyArr = Array.from(dummies);
      return { q, correct: String(correct), w1: dummyArr[0], w2: dummyArr[1], w3: dummyArr[2], subject: 'sansu', grade: grade };
    };

    // AIのマンネリを防ぐためのランダムテーマ集
    const AI_THEMES = [
      "日常のふしぎ", "動物・生き物", "宇宙・星", "食べ物・料理", "スポーツ・遊び", 
      "歴史・昔のひと", "ゲーム風・ファンタジー", "身近な機械や道具", "自然・天気",

    const generateQuestionWithAI = async (subjectName, gradeName, historyList, isChallenge = false) => {
      if(!geminiApiKey) return null; // APIキーがない場合はすぐ諦める（フォールバックへ）

      const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${geminiApiKey}`;
      const historyStr = historyList.slice(-15).join(', '); // 履歴を15問に増加
      const randomTheme = AI_THEMES[Math.floor(Math.random() * AI_THEMES.length)];

      let prompt = `あなたは日本の${gradeName}向けの${subjectName}の先生です。
以下の条件で4択問題を1つ作成してください。
- 【重要】問題の切り口として「${randomTheme}」に関連づけた、面白くて新鮮な問題文にしてください。（無理のない範囲で）
- 過去に出題された以下の問題とは「絶対に違う」内容にしてください。
- 過去の出題: [${historyStr}]
- 返却は必ず以下のJSONスキーマのみを含めてください。マークダウンの装飾(\`\`\`json)などは不要です。
- {"q": "問題文", "correct": "正解", "w1": "不正解1", "w2": "不正解2", "w3": "不正解3"}`;

      if (isChallenge) {
        prompt = `あなたは超難問を出題するクイズマスターです。
以下の条件で4択問題を1つ作成してください。
- ジャンルは問わず、大人が間違えるレベルの非常に難しい問題（難読漢字、複雑な計算、マニアックな理科社会の知識、ひっかけ問題など）にしてください。
- 【重要】問題の切り口に「${randomTheme}」の要素を少し混ぜて、ユニークな視点の問題にしてください。
- 過去に出題された以下の問題とは「絶対に違う」内容にしてください。
- 過去の出題: [${historyStr}]
- 返却は必ず以下のJSONスキーマのみを含めてください。マークダウンの装飾(\`\`\`json)などは不要です。
- {"q": "問題文", "correct": "正解", "w1": "不正解1", "w2": "不正解2", "w3": "不正解3"}`;
      }

      const payload = { contents: [{ parts: [{ text: prompt }] }], generationConfig: { responseMimeType: "application/json" } };
      try {
        const response = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
        const result = await response.json();
        if (result.candidates && result.candidates.length > 0) {
          let jsonStr = result.candidates[0].content.parts[0].text;
          try {
            let cleanStr = jsonStr.replace(/```json/gi, '').replace(/```/g, '').trim();
            if (cleanStr.includes('}\n{') || cleanStr.includes('}{')) cleanStr = `[${cleanStr.replace(/\}\s*\{/g, '},{')}]`;
            const parsed = JSON.parse(cleanStr);
            return Array.isArray(parsed) ? parsed[0] : parsed;
          } catch (parseError) {
            const match = jsonStr.match(/\{[^{}]*\}/);
            if (match) return JSON.parse(match[0]);
            throw parseError;
          }
        }
      } catch (error) { console.error("AI Generation Error", error); }
      return null;
    };

      { subject: 'syakai', grade: 'g3', q: "地図記号の「文」が表すのは？", correct: "学校", w1: "交番", w2: "病院", w3: "郵便局" },

      { subject: 'syakai', grade: 'g5', q: "米の生産量が日本一多い都道府県は？", correct: "新潟県", w1: "秋田県", w2: "北海道", w3: "青森県" },
      { subject: 'challenge', grade: 'g5', q: "1から100までの整数をすべて足すといくつになる？", correct: "5050", w1: "5000", w2: "5100", w3: "5500" },

    const getLevelData = (totalExp) => {
      let level = 1; let expForNext = 50; let currentBase = 0;
      while (totalExp >= currentBase + expForNext) { currentBase += expForNext; level++; expForNext = Math.floor(expForNext * 1.5); }
      return { level, expInCurrentLevel: totalExp - currentBase, expForNext, maxHp: 50 + (level - 1) * 20, maxMp: 30 + (level - 1) * 10, baseDamage: 10 + (level - 1) * 5 };
    };

    const shuffleArray = (array) => {
      const newArr = [...array];
      for (let i = newArr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [newArr[i], newArr[j]] = [newArr[j], newArr[i]]; }
      return newArr;
    };

    // ==========================================
    // 3. Main App Component
    // ==========================================
    function App() {
      const [view, setView] = useState('title');
      const [profile, setProfile] = useState(null);
      const [customQuestions, setCustomQuestions] = useState([]);
      const [battleParams, setBattleParams] = useState(null); 

      // 起動時のデータ読み込み処理（Firebase + localStorage）
      useEffect(() => {
        const loadData = async () => {
          const savedProfile = localStorage.getItem('studyQuest_profile');
          if (savedProfile) {
            const localData = JSON.parse(savedProfile);
            setProfile(localData); // まずローカルを即時反映

            // Firebaseが有効ならクラウドから最新データを取得して上書き
            if (db && localData.name) {
              try {
                const doc = await db.collection('players').doc(localData.name).get();
                if (doc.exists) setProfile(doc.data());
              } catch(e) { console.error("Firebase読み込みエラー", e); }
            }
          }
          const savedQuestions = localStorage.getItem('studyQuest_customQuestions');
          if (savedQuestions) setCustomQuestions(JSON.parse(savedQuestions));
        };
        loadData();
      }, []);

      // セーブ処理（ローカル ＋ クラウド同期）
      const saveProfile = (newProfile) => {
        setProfile(newProfile);
        localStorage.setItem('studyQuest_profile', JSON.stringify(newProfile));
        
        if (db && newProfile.name) {
          db.collection('players').doc(newProfile.name).set(newProfile)
            .catch(err => console.error("Firebase保存エラー:", err));
        }
      };

      const saveCustomQuestions = (newQuestions) => {
        setCustomQuestions(newQuestions);
        localStorage.setItem('studyQuest_customQuestions', JSON.stringify(newQuestions));
      };

      const handleCreateProfile = (name) => {
        saveProfile({ ...INITIAL_PROFILE, name });
        setView('map');
      };

      const handleTransfer = async (transferName) => {
        if (!db) {
          alert("Firebaseの設定がまだ完了していません。");
          return;
        }
        try {
          const doc = await db.collection('players').doc(transferName).get();
          if (doc.exists) {
            saveProfile(doc.data());
            setView('map');
            alert("データの引き継ぎに成功しました！");
          } else {
            alert("その名前のデータは見つかりませんでした。");
          }
        } catch(e) {
          alert("エラーが発生しました。");
        }
      };

      if (view === 'title') return <TitleScreen profile={profile} onStart={() => profile ? setView('map') : setView('create')} onTeacher={() => setView('teacher')} onTransfer={handleTransfer} dbReady={!!db} aiReady={!!geminiApiKey} />;
      if (view === 'create') return <CreateScreen onSubmit={handleCreateProfile} onBack={() => setView('title')} />;
      if (view === 'teacher') return <TeacherScreen customQuestions={customQuestions} saveCustomQuestions={saveCustomQuestions} onBack={() => setView('title')} />;
      if (view === 'shop') return <ShopScreen profile={profile} saveProfile={saveProfile} onBack={() => setView('map')} />;
      if (view === 'battle' && battleParams) return <BattleScreen profile={profile} saveProfile={saveProfile} params={battleParams} allQuestions={[...BUILT_IN_QUESTIONS, ...customQuestions]} onEnd={() => setView('map')} />;

      const [gachaResult, setGachaResult] = useState(null);

        if (profile.coins >= item.price) {
          saveProfile({
            ...profile,
            coins: profile.coins - item.price,
            ownedItems: [...profile.ownedItems, item.id]
          });
        }
      };

      const handleEquip = (itemId, type) => {
        saveProfile({
          ...profile,
          equipped: { ...profile.equipped, [type]: itemId }
        });
      };

      const handleGacha = () => {
        const cost = 100;
        if (profile.coins < cost) return;

        const pool = [
          ...ITEMS.head.filter(i => i.id !== 'h_none'),
          ...ITEMS.body.filter(i => i.id !== 'b_none'),
          ...ITEMS.weapon.filter(i => i.id !== 'w_none'),
          ...PETS.filter(p => p.id !== 'p_none').map(p => ({ ...p, isPet: true }))
        ];
        
        const rand = Math.random() * 100;
        let targetRank = 'N';
        if (rand < 2) targetRank = 'UR';
        else if (rand < 10) targetRank = 'SSR';
        else if (rand < 30) targetRank = 'SR';
        else if (rand < 60) targetRank = 'R';
        
        let targetPool = pool.filter(i => i.rank === targetRank);
        if (targetPool.length === 0) targetPool = pool;

        const item = targetPool[Math.floor(Math.random() * targetPool.length)];

        let newProfile = { ...profile, coins: profile.coins - cost };
        
        if (item.isPet) {
          if (!newProfile.ownedPets.includes(item.id)) {
            newProfile.ownedPets.push(item.id);
          }
        } else {
          if (!newProfile.ownedItems.includes(item.id)) {
            newProfile.ownedItems.push(item.id);
          }
        }

        setGachaResult(item);
        saveProfile(newProfile);
        
        setTimeout(() => setGachaResult(null), 3000);
      };

      const getEquippedItem = (type) => ITEMS[type].find(i => i.id === profile.equipped[type]) || ITEMS[type][0];
      const getEquippedPet = () => PETS.find(p => p.id === profile.equipped.pet) || PETS[0];

      return (
        <div className="min-h-screen bg-orange-50 p-4 font-sans pb-24 relative overflow-hidden">
          {gachaResult && (
            <div className={`absolute inset-0 z-50 flex items-center justify-center bg-black/60`}>
              <div className={`bg-white p-8 rounded-3xl text-center animate-bounce shadow-2xl border-4 ${RANK_STYLES[gachaResult.rank].border}`}>
                 <div className={`text-xl font-black mb-2 ${RANK_STYLES[gachaResult.rank].color}`}>{RANK_STYLES[gachaResult.rank].label}</div>
                 <div className="text-6xl mb-4">{gachaResult.emoji}</div>
                 <div className="text-2xl font-black text-orange-600 mb-2">{gachaResult.name} をゲット！</div>
                 <div className="text-gray-500 font-bold">やったね！</div>
              </div>
            </div>
          )}

          <div className="flex justify-between items-center mb-6">
            <button onClick={onBack} className="bg-white p-2 rounded-full shadow-md font-black text-gray-600 px-4">◀ もどる</button>
            <div className="bg-white px-4 py-2 rounded-full font-black text-yellow-600 shadow-md flex items-center gap-2 text-xl">
              <span>🪙</span> {profile.coins}
            </div>
          </div>

          <div className="bg-white rounded-3xl p-6 shadow-md mb-6 flex flex-col items-center border-2 border-orange-200">
            <div className="text-sm font-bold text-gray-500 mb-2">げんざいの そうび</div>
            <div className="text-6xl relative flex items-center justify-center h-24 w-24">
              <span className="absolute -top-4 z-30">{getEquippedItem('head').emoji !== '🧑' ? getEquippedItem('head').emoji : ''}</span>
              <span className="z-20">🧑</span>
              <span className="absolute -bottom-2 z-30">{getEquippedItem('body').emoji !== '👕' ? getEquippedItem('body').emoji : ''}</span>
              <span className="absolute -right-4 top-2 z-40 transform rotate-12">{getEquippedItem('weapon').emoji !== '✊' ? getEquippedItem('weapon').emoji : ''}</span>
              <span className="absolute -left-6 bottom-0 z-10 text-4xl">{getEquippedPet().emoji !== '🐾' ? getEquippedPet().emoji : ''}</span>
            </div>
          </div>

          <div className="mb-8">
            <button 
              onClick={handleGacha}
              disabled={profile.coins < 100}
              className="w-full bg-gradient-to-r from-yellow-400 to-orange-500 disabled:from-gray-300 disabled:to-gray-400 text-white font-black text-2xl py-4 rounded-2xl shadow-[0_6px_0_#c2410c] disabled:shadow-none active:translate-y-2 transition-all flex justify-center items-center gap-2"
            >
              <span>🎁</span> 100コインで ガチャをまわす！
            </button>
          </div>

          <div className="mb-8">
            <h3 className="text-xl font-black text-gray-800 mb-3 border-l-4 border-orange-400 pl-2">おともペット (ガチャでゲット)</h3>
            <div className="flex overflow-x-auto gap-4 pb-4 px-1 snap-x">
              {PETS.map(pet => {
                const isOwned = profile.ownedPets?.includes(pet.id);
                const isEquipped = profile.equipped.pet === pet.id;
                return (
                  <div key={pet.id} className={`snap-center flex-shrink-0 w-36 bg-white rounded-2xl p-4 shadow-sm border-2 flex flex-col items-center justify-between ${isEquipped ? 'border-green-400 bg-green-50' : RANK_STYLES[pet.rank].border + ' ' + RANK_STYLES[pet.rank].bg}`}>
                    <div className="flex justify-between w-full mb-1">
                      <span className={`text-[10px] font-black px-2 py-0.5 rounded-sm bg-white border ${RANK_STYLES[pet.rank].color}`}>{RANK_STYLES[pet.rank].label}</span>
                      <span className="text-[10px] font-bold text-gray-500">MP+{pet.bonus}</span>
                    </div>
                    <div className="text-4xl mb-2">{pet.emoji}</div>
                    <div className="font-bold text-sm text-center mb-2 h-10 flex items-center justify-center">{pet.name}</div>
                    {isEquipped ? (
                      <div className="text-xs font-black text-green-600 bg-white px-2 py-1 rounded-full border border-green-200 w-full text-center">おとも中</div>
                    ) : isOwned ? (
                      <button onClick={() => handleEquip(pet.id, 'pet')} className="text-xs font-black text-blue-600 bg-blue-50 hover:bg-blue-100 px-2 py-1 rounded-full w-full text-center transition-colors">おともする</button>
                    ) : (
                      <div className="text-xs font-black text-gray-400 bg-gray-100 px-2 py-1 rounded-full w-full text-center">未入手</div>
                    )}
                  </div>
                );
              })}
            </div>
          </div>

          {['weapon', 'head', 'body'].map(type => (
            <div key={type} className="mb-8">
              <h3 className="text-xl font-black text-gray-800 mb-3 border-l-4 border-orange-400 pl-2">
                {type === 'head' ? 'ぼうし (HPアップ)' : type === 'body' ? 'ふく (ぼうぎょアップ)' : 'ぶき (こうげきアップ)'}
              </h3>
              <div className="flex overflow-x-auto gap-4 pb-4 px-1 snap-x">
                {ITEMS[type].map(item => {
                  const isOwned = profile.ownedItems.includes(item.id);
                  const isEquipped = profile.equipped[type] === item.id;

                  return (
                    <div key={item.id} className={`snap-center flex-shrink-0 w-36 bg-white rounded-2xl p-4 shadow-sm border-2 flex flex-col items-center justify-between ${isEquipped ? 'border-green-400 bg-green-50' : RANK_STYLES[item.rank].border + ' ' + RANK_STYLES[item.rank].bg}`}>
                      <div className="flex justify-between w-full mb-1">
                        <span className={`text-[10px] font-black px-2 py-0.5 rounded-sm bg-white border ${RANK_STYLES[item.rank].color}`}>{RANK_STYLES[item.rank].label}</span>
                        <span className="text-[10px] font-bold text-gray-500">
                          {type === 'head' ? `HP+${item.bonus}` : type === 'body' ? `防御+${item.bonus}` : `攻撃+${item.bonus}`}
                        </span>
                      </div>
                      <div className="text-4xl mb-2">{item.emoji}</div>
                      <div className="font-bold text-sm text-center mb-2 h-10 flex items-center justify-center">{item.name}</div>
                      
                      {isEquipped ? (
                        <div className="text-xs font-black text-green-600 bg-white px-2 py-1 rounded-full border border-green-200 w-full text-center">そうび中</div>
                      ) : isOwned ? (
                        <button onClick={() => handleEquip(item.id, type)} className="text-xs font-black text-blue-600 bg-blue-50 hover:bg-blue-100 px-2 py-1 rounded-full w-full text-center transition-colors">
                          そうびする
                        </button>
                      ) : (
                        <button 
                          onClick={() => handleBuy(item, type)} 
                          disabled={profile.coins < item.price}
                          className={`text-xs font-black px-2 py-1 rounded-full w-full text-center transition-all ${profile.coins >= item.price ? 'bg-yellow-400 hover:bg-yellow-500 text-white shadow-sm' : 'bg-gray-200 text-gray-400'}`}
                        >
                          🪙 {item.price}
                        </button>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>
          ))}
        </div>
      );
    }

    function BattleScreen({ profile, saveProfile, params, allQuestions, onEnd }) {
      const levelData = useMemo(() => getLevelData(profile.exp), [profile.exp]);
      
      const equippedHead = ITEMS.head.find(i => i.id === profile.equipped.head) || ITEMS.head[0];
      const equippedBody = ITEMS.body.find(i => i.id === profile.equipped.body) || ITEMS.body[0];
      const equippedWeapon = ITEMS.weapon.find(i => i.id === profile.equipped.weapon) || ITEMS.weapon[0];
      const equippedPet = PETS.find(p => p.id === profile.equipped.pet) || PETS[0];

      const totalMaxHp = levelData.maxHp + equippedHead.bonus;
      const totalMaxMp = levelData.maxMp + equippedPet.bonus;
      const totalBaseDamage = levelData.baseDamage + equippedWeapon.bonus;
      const defenseBonus = equippedBody.bonus;

      const [phase, setPhase] = useState('intro');
      const [enemy, setEnemy] = useState(null);
      const [playerHp, setPlayerHp] = useState(totalMaxHp);
      const [playerMp, setPlayerMp] = useState(0); 
      const [enemyHp, setEnemyHp] = useState(0);
      
      const [questionList, setQuestionList] = useState([]);
      const [currentQ, setCurrentQ] = useState(null);
      const [options, setOptions] = useState([]);
      const [askedQuestions, setAskedQuestions] = useState([]);
      
      const [combo, setCombo] = useState(0);
      const [qStartTime, setQStartTime] = useState(0);
      const [lastAction, setLastAction] = useState(null);

      const correctsRef = useRef(0);

      const [shakeTarget, setShakeTarget] = useState(null);
      const [dmgText, setDmgText] = useState(null);

      useEffect(() => {
        const stages = profile.clearedStages || 0;
        const isBossBattle = (stages + 1) % 5 === 0;
        const enemyBase = isBossBattle 
          ? BOSSES[Math.floor(Math.random() * BOSSES.length)]
          : MONSTERS[Math.floor(Math.random() * MONSTERS.length)];
        
        const multiplier = 1 + ((levelData.level - 1) * 0.4) + (stages * 0.15);
        const scaledEnemy = {
          ...enemyBase,
          level: Math.floor(levelData.level + (stages * 0.5)),
          maxHp: Math.floor(enemyBase.hp * multiplier),
          hp: Math.floor(enemyBase.hp * multiplier),
          damage: Math.floor(enemyBase.damage * multiplier)
        };

        setEnemy(scaledEnemy);
        setEnemyHp(scaledEnemy.hp);

        let initialQList = [];
        if (params.subject !== 'sansu' && params.subject !== 'challenge') {
          initialQList = shuffleArray(allQuestions.filter(q => q.subject === params.subject && q.grade === params.grade.id));
          setQuestionList(initialQList);
        }

        setTimeout(() => {
          fetchNextQuestion(initialQList);
        }, 2000);
      }, []);

      const fetchNextQuestion = async (qList = questionList) => {
        setPhase('loading');
        let q = null;
        let attempts = 0;
        const maxAttempts = 3;
        const isChallenge = params.subject === 'challenge';

        while (!q && attempts < maxAttempts) {
          attempts++;
          
          if ((params.subject !== 'sansu' || isChallenge) && (qList.length === 0 || Math.random() < 0.5 || isChallenge)) {
            const subjectName = SUBJECTS.find(s => s.id === params.subject).name;
            const aiQ = await generateQuestionWithAI(subjectName, params.grade.name, askedQuestions, isChallenge);
            if (aiQ && !askedQuestions.includes(aiQ.q)) {
               q = { ...aiQ, subject: params.subject, grade: params.grade.id };
            }
          } 
          
          if (!q) {
            if (params.subject === 'sansu' && !isChallenge) {
              const mathQ = generateMathQuestion(params.grade.id);
              if (!askedQuestions.includes(mathQ.q)) {
                q = mathQ;
              }
            } else {
              let fallbackList = qList.length > 0 ? [...qList] : shuffleArray(allQuestions.filter(q => q.subject === params.subject && q.grade === params.grade.id));
              if (fallbackList.length === 0) fallbackList = BUILT_IN_QUESTIONS.filter(q => q.subject === (isChallenge ? 'challenge' : 'kokugo'));
              while (fallbackList.length > 0) {
                const candidate = fallbackList.pop();
                if (!askedQuestions.includes(candidate.q)) {
                  q = candidate;
                  setQuestionList(fallbackList);
                  break;
                }
              }
              if (!q) {
                 setAskedQuestions([]);
                 q = fallbackList.pop() || generateMathQuestion(params.grade.id);
              }
            }
          }
        }

        if (q) setAskedQuestions(prev => [...prev, q.q]);

        setCurrentQ(q);
        
        const opts = shuffleArray([
          { text: q.correct, isCorrect: true },
          { text: q.w1, isCorrect: false },
          { text: q.w2, isCorrect: false },
          { text: q.w3, isCorrect: false },
        ]);
        setOptions(opts);
        
        setLastAction(null);
        setPhase('question');
        setQStartTime(Date.now());
      };

      const handleSkill = (skillType) => {
        if (phase !== 'question') return;
        
        if (skillType === 'heal' && playerMp >= 20) {
          setPlayerMp(prev => prev - 20);
          const healAmount = Math.floor(totalMaxHp * 0.5);
          setPlayerHp(prev => Math.min(totalMaxHp, prev + healAmount));
          setLastAction({ type: 'heal', damage: healAmount });
          setDmgText({ val: `+${healAmount}`, type: 'heal' });
          setPhase('result');
        } else if (skillType === 'magic' && playerMp >= 30) {
          setPlayerMp(prev => prev - 30);
          const dmg = totalBaseDamage * 3;
          const newHp = Math.max(0, enemyHp - dmg);
          setEnemyHp(newHp);
          setLastAction({ type: 'magic', damage: dmg });
          triggerShake('enemy', dmg);
          
          if (newHp <= 0) {
            setPhase('clear');
            const today = new Date().toLocaleDateString();
            const currentMissions = profile.missions?.date === today ? profile.missions : { date: today, battles: 0, corrects: 0, claimed: [] };
            
            saveProfile({
              ...profile,
              exp: profile.exp + params.grade.expReward,
              coins: profile.coins + params.grade.coinReward,
              clearedStages: (profile.clearedStages || 0) + 1,
              lastPlayTime: Date.now(),
              missions: {
                ...currentMissions,
                battles: currentMissions.battles + 1,
                corrects: currentMissions.corrects + correctsRef.current
              }
            });
          } else {
            setPhase('result');
          }
        }
      };

      const handleAnswer = (opt) => {
        if (phase !== 'question') return;
        
        const timeTaken = Date.now() - qStartTime;
        const isCritical = opt.isCorrect && timeTaken < 3000;
        
        if (opt.isCorrect) {
          correctsRef.current += 1;
          const newCombo = combo + 1;
          setCombo(newCombo);
          
          setPlayerMp(prev => Math.min(totalMaxMp, prev + 10));
          
          let dmg = totalBaseDamage + Math.floor(newCombo * 2.0);
          if (isCritical) dmg = Math.floor(dmg * 1.5);
          
          const newHp = Math.max(0, enemyHp - dmg);
          setEnemyHp(newHp);
          setLastAction({ type: isCritical ? 'critical' : 'correct', damage: dmg });
          
          triggerShake('enemy', dmg);
          
          if (newHp <= 0) {
            setPhase('clear');
            const today = new Date().toLocaleDateString();
            const currentMissions = profile.missions?.date === today ? profile.missions : { date: today, battles: 0, corrects: 0, claimed: [] };

            saveProfile({
              ...profile,
              exp: profile.exp + params.grade.expReward,
              coins: profile.coins + params.grade.coinReward,
              clearedStages: (profile.clearedStages || 0) + 1,
              lastPlayTime: Date.now(),
              missions: {
                ...currentMissions,
                battles: currentMissions.battles + 1,
                corrects: currentMissions.corrects + correctsRef.current
              }
            });
          } else {
            setPhase('result');
          }
        } else {
          setCombo(0);
          const dmg = params.subject === 'challenge' ? totalMaxHp : Math.max(1, enemy.damage - defenseBonus);
          const newHp = Math.max(0, playerHp - dmg);
          setPlayerHp(newHp);
          setLastAction({ type: 'wrong', damage: dmg });
          
          triggerShake('player', dmg);

          if (newHp <= 0) {
            setPhase('gameover');
            const today = new Date().toLocaleDateString();
            const currentMissions = profile.missions?.date === today ? profile.missions : { date: today, battles: 0, corrects: 0, claimed: [] };

            saveProfile({
              ...profile,
              lastPlayTime: Date.now(),
              missions: {
                ...currentMissions,
                corrects: currentMissions.corrects + correctsRef.current
              }
            });
          } else {
            setPhase('result');
          }
        }
      };

      const triggerShake = (target, dmg) => {
        setShakeTarget(target);
        setDmgText({ val: dmg, type: target === 'enemy' ? 'damage' : 'hurt' });
        setTimeout(() => {
          setShakeTarget(null);
          setDmgText(null);
        }, 800);
      };

      const getEquippedItem = (type) => ITEMS[type].find(i => i.id === profile.equipped[type]) || ITEMS[type][0];
      const getEquippedPet = () => PETS.find(p => p.id === profile.equipped.pet) || PETS[0];

      if (phase === 'intro') {
        return (
          <div className="fixed inset-0 bg-black flex flex-col items-center justify-center z-50">
            {enemy && (
               <div className="text-center animate-zoom-in">
                 <div className="text-9xl mb-4 drop-shadow-[0_0_20px_rgba(255,0,0,0.8)] grayscale contrast-150">{enemy.emoji}</div>
                 <h2 className="text-4xl font-black text-red-500 mb-2">{enemy.name} があらわれた！</h2>
                 {enemy.isBoss && <p className="text-yellow-400 font-bold text-xl animate-pulse">{enemy.desc}</p>}
               </div>
            )}
            <style>{`
              .animate-zoom-in { animation: zoomIn 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
              @keyframes zoomIn { 0% { opacity: 0; transform: scale(0.5); } 100% { opacity: 1; transform: scale(1); } }
            `}</style>
          </div>
        );
      }

      return (
        <div className={`fixed inset-0 z-50 flex flex-col font-sans ${enemy?.isBoss ? 'bg-red-950' : 'bg-gray-900'}`}>
          <div className="flex-1 relative flex flex-col justify-around p-4 overflow-hidden">
            <div className="absolute inset-0 bg-gradient-to-t from-black/90 to-transparent z-0"></div>
            {enemy?.isBoss && <div className="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-red-900/50 via-transparent to-transparent animate-pulse z-0 pointer-events-none"></div>}

            <div className="absolute top-4 left-4 right-4 flex justify-between items-start z-20">
              <div className="text-white/50 text-xs font-bold bg-black/40 px-2 py-1 rounded border border-white/20">
                {SUBJECTS.find(s=>s.id===params.subject).name} / {params.grade.name} / STAGE {profile.clearedStages || 0}
              </div>
              {combo > 1 && (
                <div className="text-right animate-bounce">
                  <div className="text-yellow-400 font-black text-4xl italic drop-shadow-md">{combo} COMBO!</div>
                  <div className="text-yellow-200 text-xs font-bold">ダメージUP!</div>
                </div>
              )}
            </div>

            <div className={`z-10 flex flex-col items-center mt-10 transition-transform ${shakeTarget === 'enemy' ? 'animate-shake' : ''}`}>
              <div className="w-48 mb-2">
                 <div className="flex justify-between text-xs font-black text-red-400 mb-1 drop-shadow-md">
                   <span>Lv.{enemy?.level} {enemy?.name}</span>
                   <span>{enemyHp} / {enemy?.maxHp}</span>
                 </div>
                 <div className="h-3 w-full bg-red-950 rounded-full border border-red-800 shadow-inner overflow-hidden">
                   <div className="h-full bg-gradient-to-r from-red-700 to-red-500 transition-all duration-300" style={{ width: `${(enemyHp/enemy?.maxHp)*100}%`}}></div>
                 </div>
              </div>
              
              <div className="relative">
                <div className={`text-9xl drop-shadow-[0_10px_20px_rgba(255,0,0,0.3)] grayscale contrast-125 ${enemy?.isBoss ? 'text-[11rem] animate-pulse' : 'animate-float'}`}>
                  {enemy?.emoji}
                </div>
                {dmgText && dmgText.type === 'damage' && (
                  <div className="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-6xl font-black text-white drop-shadow-[0_4px_4px_rgba(0,0,0,0.8)] animate-dmg-pop text-stroke z-50">
                    {dmgText.val}
                  </div>
                )}
              </div>
            </div>

            <div className={`z-10 flex flex-col items-center mb-4 transition-transform ${shakeTarget === 'player' ? 'animate-shake' : ''}`}>
              <div className="relative">
                 <div className="text-7xl drop-shadow-[0_10px_10px_rgba(0,0,0,0.5)] relative flex items-center">
                    <span className="absolute -left-6 bottom-0 z-10 text-4xl animate-bounce">{getEquippedPet().emoji !== '🐾' ? getEquippedPet().emoji : ''}</span>
                    <span className="absolute -top-4 z-30">{getEquippedItem('head').emoji !== '🧑' ? getEquippedItem('head').emoji : ''}</span>
                    <span className="z-20">🧑</span>
                    <span className="absolute -bottom-2 z-30">{getEquippedItem('body').emoji !== '👕' ? getEquippedItem('body').emoji : ''}</span>
                    <span className="absolute -right-4 top-2 z-40 transform rotate-12">{getEquippedItem('weapon').emoji !== '✊' ? getEquippedItem('weapon').emoji : ''}</span>
                 </div>
                 {dmgText && (dmgText.type === 'hurt' || dmgText.type === 'heal') && (
                  <div className={`absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-5xl font-black drop-shadow-[0_4px_4px_rgba(0,0,0,0.8)] animate-dmg-pop text-stroke z-50 ${dmgText.type === 'heal' ? 'text-green-400' : 'text-red-500'}`}>
                    {dmgText.val}
                  </div>
                )}
              </div>
              
              <div className="w-64 mt-4 flex flex-col gap-1 bg-black/40 p-3 rounded-2xl border border-white/10 backdrop-blur-sm shadow-xl">
                 <div className="flex justify-between text-sm font-black text-white mb-1 drop-shadow-[0_2px_2px_rgba(0,0,0,1)]">
                   <span>{profile.name}</span>
                   <span className="text-green-400">HP {playerHp} / {totalMaxHp}</span>
                 </div>
                 <div className="h-4 w-full bg-gray-900 rounded-full border border-gray-700 shadow-inner overflow-hidden mb-2">
                   <div className="h-full bg-green-500 transition-all duration-300" style={{ width: `${(playerHp/totalMaxHp)*100}%`}}></div>
                 </div>
                 
                 <div className="flex justify-between text-xs font-black text-blue-300 drop-shadow-[0_2px_2px_rgba(0,0,0,1)]">
                   <span>MP</span>
                   <span>{playerMp} / {totalMaxMp}</span>
                 </div>
                 <div className="h-2 w-full bg-gray-900 rounded-full border border-gray-700 shadow-inner overflow-hidden">
                   <div className="h-full bg-blue-500 transition-all duration-300" style={{ width: `${(playerMp/totalMaxMp)*100}%`}}></div>
                 </div>
              </div>
            </div>
          </div>

          <div className="bg-white rounded-t-3xl shadow-[0_-10px_25px_rgba(0,0,0,0.3)] z-30 flex flex-col relative">
            
            {phase === 'question' && (
              <div className="absolute -top-14 right-4 flex gap-2">
                <button 
                  onClick={() => handleSkill('heal')}
                  disabled={playerMp < 20}
                  className="bg-green-500 disabled:bg-gray-400 text-white font-black text-sm px-4 py-2 rounded-full shadow-[0_4px_0_rgba(0,0,0,0.2)] disabled:shadow-none active:translate-y-1 transition-all flex flex-col items-center border-2 border-white"
                >
                  <span>かいふく</span><span className="text-[10px]">MP20</span>
                </button>
                <button 
                  onClick={() => handleSkill('magic')}
                  disabled={playerMp < 30}
                  className="bg-purple-500 disabled:bg-gray-400 text-white font-black text-sm px-4 py-2 rounded-full shadow-[0_4px_0_rgba(0,0,0,0.2)] disabled:shadow-none active:translate-y-1 transition-all flex flex-col items-center border-2 border-white"
                >
                  <span>まほう</span><span className="text-[10px]">MP30</span>
                </button>
              </div>
            )}

            {phase === 'loading' && (
              <div className="p-12 text-center flex flex-col items-center justify-center animate-pulse">
                <div className="text-4xl mb-4">🤖</div>
                <p className="font-bold text-gray-500 text-lg">AIが新しい問題を生成中...</p>
              </div>
            )}

            {phase === 'question' && currentQ && (
              <div className="p-4 pb-8 pt-6 animate-slide-up">
                <h3 className="text-xl font-black text-gray-800 mb-6 text-center leading-relaxed border-b-2 border-gray-100 pb-4">
                  {currentQ.q}
                </h3>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                  {options.map((opt, i) => (
                    <button
                      key={i}
                      onClick={() => handleAnswer(opt)}
                      className="bg-gray-50 border-2 border-gray-200 hover:border-blue-400 hover:bg-blue-50 text-gray-800 font-bold p-4 rounded-2xl text-left transition-all active:scale-95 active:bg-blue-100 flex items-center"
                    >
                      <span className="w-8 h-8 rounded-full bg-white border border-gray-300 text-gray-500 flex items-center justify-center mr-3 font-black text-sm shrink-0">
                        {i + 1}
                      </span>
                      <span className="text-lg">{opt.text}</span>
                    </button>
                  ))}
                </div>
              </div>
            )}

            {phase === 'result' && lastAction && (
              <div className="p-6 pb-8 text-center animate-slide-up flex flex-col items-center pt-8">
                {lastAction.type === 'critical' && <div className="text-3xl font-black text-yellow-500 mb-2 animate-bounce drop-shadow-sm">CRITICAL HIT!! ✨</div>}
                {lastAction.type === 'correct' && <div className="text-3xl font-black text-blue-500 mb-2 drop-shadow-sm">せいかい！ 〇 <span className="text-sm text-blue-300">MP+10</span></div>}
                {lastAction.type === 'wrong' && <div className="text-3xl font-black text-red-500 mb-2 drop-shadow-sm">ざんねん… ×</div>}
                {lastAction.type === 'heal' && <div className="text-3xl font-black text-green-500 mb-2 drop-shadow-sm">かいふく！ 💚</div>}
                {lastAction.type === 'magic' && <div className="text-3xl font-black text-purple-500 mb-2 drop-shadow-sm">大まほう！ ☄️</div>}
                
                <p className="text-lg font-bold text-gray-600 mb-6">
                  {(lastAction.type === 'correct' || lastAction.type === 'critical' || lastAction.type === 'magic') && `${enemy.name} に ${lastAction.damage} のダメージ！`}
                  {lastAction.type === 'wrong' && `${enemy.damage} のダメージをうけた…`}
                  {lastAction.type === 'heal' && `HPが ${lastAction.damage} かいふくした！`}
                </p>
                
                <button 
                  onClick={() => fetchNextQuestion()}
                  className="bg-blue-600 text-white w-full max-w-sm py-4 rounded-2xl font-black text-xl shadow-[0_6px_0_#1e3a8a] active:translate-y-2 active:shadow-none transition-all"
                >
                  つぎへ
                </button>
              </div>
            )}

            {phase === 'clear' && (
              <div className="p-8 text-center bg-yellow-50 rounded-t-3xl flex flex-col items-center">
                <h2 className="text-4xl font-black text-yellow-500 mb-2 drop-shadow-sm">VICTORY!!</h2>
                <p className="font-bold text-gray-600 mb-6">{enemy.name} を たおした！</p>
                
                <div className="bg-white rounded-2xl p-4 w-full max-w-sm shadow-sm border border-yellow-200 mb-6">
                  <div className="text-sm font-bold text-gray-400 mb-2">ほうしゅう</div>
                  <div className="text-2xl font-black text-green-500 mb-1">+{params.grade.expReward} EXP</div>
                  <div className="text-2xl font-black text-yellow-500">🪙 +{params.grade.coinReward} コイン</div>
                </div>

                <button 
                  onClick={onEnd}
                  className="bg-yellow-500 text-white w-full max-w-sm py-4 rounded-2xl font-black text-xl shadow-[0_6px_0_#b45309] active:translate-y-2 active:shadow-none transition-all"
                >
                  マップへもどる
                </button>
              </div>
            )}

            {phase === 'gameover' && (
              <div className="p-8 text-center bg-red-50 rounded-t-3xl flex flex-col items-center">
                <h2 className="text-4xl font-black text-red-600 mb-2 drop-shadow-sm">LOSE...</h2>
                <p className="font-bold text-gray-600 mb-6">たいりょくが なくなった…</p>
                
                <button 
                  onClick={onEnd}
                  className="bg-gray-800 text-white w-full max-w-sm py-4 rounded-2xl font-black text-xl shadow-[0_6px_0_#374151] active:translate-y-2 active:shadow-none transition-all"
                >
                  にげだす
                </button>
              </div>
            )}
          </div>

          <style>{`
            .animate-float { animation: float 3s ease-in-out infinite; }
            @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-15px); } 100% { transform: translateY(0px); } }
            
            .animate-shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
            @keyframes shake { 10%, 90% { transform: translate3d(-4px, 0, 0); } 20%, 80% { transform: translate3d(8px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-10px, 0, 0); } 40%, 60% { transform: translate3d(10px, 0, 0); } }
            
            .animate-dmg-pop { animation: dmgPop 0.8s ease-out forwards; }
            @keyframes dmgPop { 0% { opacity: 1; transform: translate(-50%, -50%) scale(0.5); } 20% { transform: translate(-50%, -80%) scale(1.2); } 100% { opacity: 0; transform: translate(-50%, -120%) scale(1); } }
            
            .animate-slide-up { animation: slideUp 0.3s ease-out; }
            @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

            .text-stroke { -webkit-text-stroke: 2px black; }
          `}</style>
        </div>
      );
    }

    // ==========================================
    // ★ ここが抜けていたため画面が真っ白になっていました！ ★
    // 6. App Rendering (画面への描画指示)
    // ==========================================
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
    
  </script>
</body>
</html>
