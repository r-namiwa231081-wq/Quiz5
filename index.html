<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>スタディ・クエスト</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Firebase v8 (CDN) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body class="bg-gray-900">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // ==========================================
    // ★ Firebase 設定エリア ★
    // ==========================================
    const firebaseConfig = {
      apiKey: "",
      authDomain: "",
      projectId: "",
    };

    let db = null;
    try {
      if (firebaseConfig.apiKey && typeof firebase !== 'undefined') {
        if (!firebase.apps.length) {
          firebase.initializeApp(firebaseConfig);
        }
        db = firebase.firestore();
      }
    } catch (e) {
      console.warn("Firebase Config Warning:", e);
    }

    // ==========================================
    // ★ Gemini (AI) 設定エリア ★
    // ==========================================
    const geminiApiKey = "AQ.Ab8RN6LNKNMESsU6O3SzBl-_Vm4KPQVsFhPIZmCJMVuv_6or4Q"; 

    // ==========================================
    // 1. Game Data & Constants
    // ==========================================
    const SUBJECTS = [
      { id: 'kokugo', name: '国語', color: 'bg-pink-500', icon: '📖' },
      { id: 'sansu', name: '算数', color: 'bg-blue-500', icon: '🔢' },
      { id: 'rika', name: '理科', color: 'bg-green-500', icon: '🔬' },
      { id: 'syakai', name: '社会', color: 'bg-yellow-500', icon: '🌍' },
      { id: 'challenge', name: '挑戦', color: 'bg-purple-600', icon: '🔥' },
    ];

    const GRADES = [
      { id: 'g1_2', name: '小学1〜2年', expReward: 15, coinReward: 10 },
      { id: 'g3', name: '小学3年', expReward: 25, coinReward: 15 },
      { id: 'g4', name: '小学4年', expReward: 40, coinReward: 25 },
      { id: 'g5', name: '小学5年', expReward: 60, coinReward: 40 },
    ];

    const MONSTERS = [
      { name: 'ゴブリン', img: 'https://robohash.org/goblin.png?set=set2&size=200x200', hp: 30, damage: 5, isBoss: false },
      { name: 'スライム', img: 'https://robohash.org/slime.png?set=set3&size=200x200', hp: 20, damage: 3, isBoss: false },
      { name: 'スケルトン', img: 'https://robohash.org/skeleton.png?set=set2&size=200x200', hp: 40, damage: 8, isBoss: false },
      { name: 'さまようよろい', img: 'https://robohash.org/armor.png?set=set2&size=200x200', hp: 50, damage: 10, isBoss: false },
      { name: 'ポイズンスネーク', img: 'https://robohash.org/snake.png?set=set3&size=200x200', hp: 35, damage: 12, isBoss: false },
    ];

    const BOSSES = [
      { name: '暗黒竜ダークバハムート', img: 'https://robohash.org/darkdragon.png?set=set2&size=300x300', hp: 150, damage: 20, isBoss: true },
      { name: '深淵の悪魔王', img: 'https://robohash.org/demonlord.png?set=set2&size=300x300', hp: 180, damage: 25, isBoss: true },
      { name: '古代兵器オメガ', img: 'https://robohash.org/omegamech.png?set=set1&size=300x300', hp: 200, damage: 30, isBoss: true },
      { name: '暴君ティラノス', img: 'https://robohash.org/tyrano.png?set=set2&size=300x300', hp: 160, damage: 22, isBoss: true },
    ];

    const ITEMS = {
      head: [
        { id: 'h_none', name: 'なし', emoji: '🧑', price: 0, rank: 'N', bonus: 0 },
        { id: 'h_cap', name: '赤白ぼうし', emoji: '🧢', price: 150, rank: 'N', bonus: 5 },
        { id: 'h_ribbon', name: 'リボン', emoji: '🎀', price: 250, rank: 'N', bonus: 10 },
        { id: 'h_helmet', name: 'てつのカブト', emoji: '🪖', price: 500, rank: 'R', bonus: 20 },
        { id: 'h_magician', name: '魔法使いの帽子', emoji: '🧙', price: 1000, rank: 'R', bonus: 30 },
        { id: 'h_crown', name: '王冠', emoji: '👑', price: 1500, rank: 'SR', bonus: 50 },
        { id: 'h_dragon', name: '竜騎士の兜', emoji: '🐉', price: 4000, rank: 'SSR', bonus: 100 },
      ],
      body: [
        { id: 'b_none', name: 'ふだんぎ', emoji: '👕', price: 0, rank: 'N', bonus: 0 },
        { id: 'b_apron', name: 'エプロン', emoji: '🎽', price: 200, rank: 'N', bonus: 2 },
        { id: 'b_armor', name: 'てつのよろい', emoji: '🛡️', price: 600, rank: 'R', bonus: 5 },
        { id: 'b_robe', name: 'まほうのローブ', emoji: '👘', price: 1250, rank: 'SR', bonus: 10 },
        { id: 'b_hero', name: 'ヒーロースーツ', emoji: '🦸', price: 2500, rank: 'SSR', bonus: 20 },
        { id: 'b_mech', name: 'メカスーツ', emoji: '🤖', price: 6000, rank: 'UR', bonus: 40 },
      ],
      weapon: [
        { id: 'w_none', name: 'すで', emoji: '✊', price: 0, rank: 'N', bonus: 0 },
        { id: 'w_ruler', name: '30cmじょうぎ', emoji: '📏', price: 250, rank: 'N', bonus: 3 },
        { id: 'w_sword', name: 'ゆうしゃの剣', emoji: '🗡️', price: 750, rank: 'R', bonus: 10 },
        { id: 'w_wand', name: 'まほうの杖', emoji: '🪄', price: 1000, rank: 'R', bonus: 15 },
        { id: 'w_bow', name: '狩人の弓', emoji: '🏹', price: 1500, rank: 'SR', bonus: 20 },
        { id: 'w_excalibur', name: '聖剣エクスカリバー', emoji: '⚔️', price: 7500, rank: 'UR', bonus: 80 },
      ]
    };

    const PETS = [
      { id: 'p_none', name: 'なし', emoji: '🐾', rank: 'N', bonus: 0 },
      { id: 'p_dog', name: 'イヌ', emoji: '🐶', rank: 'R', bonus: 10 },
      { id: 'p_cat', name: 'ネコ', emoji: '🐱', rank: 'R', bonus: 10 },
      { id: 'p_dragon', name: 'コリュウ', emoji: '🐲', rank: 'SSR', bonus: 50 },
    ];

    const INITIAL_PROFILE = {
      name: '',
      exp: 0,
      coins: 0,
      clearedStages: 0,
      ownedItems: ['h_none', 'b_none', 'w_none'],
      equipped: { head: 'h_none', body: 'b_none', weapon: 'w_none', pet: 'p_none' },
      ownedPets: ['p_none'],
      lastPlayTime: Date.now()
    };

    const sanitizeProfile = (raw) => {
      if (!raw) return null;
      return {
        ...INITIAL_PROFILE,
        ...raw,
        equipped: { ...INITIAL_PROFILE.equipped, ...(raw.equipped || {}) },
        ownedItems: Array.isArray(raw.ownedItems) ? raw.ownedItems : ['h_none', 'b_none', 'w_none'],
        ownedPets: Array.isArray(raw.ownedPets) ? raw.ownedPets : ['p_none']
      };
    };

    // ==========================================
    // 2. Question Generators
    // ==========================================
    const generateMathQuestion = (grade) => {
      let q = ""; let correct = 0;
      const rand = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
      if (grade === 'g1_2') {
        const a = rand(1, 20); const b = rand(1, 20); q = `${a} + ${b} = ?`; correct = a + b;
      } else if (grade === 'g3') {
        const a = rand(10, 99); const b = rand(2, 9); q = `${a} × ${b} = ?`; correct = a * b;
      } else {
        const a = rand(100, 999); const b = rand(10, 99); q = `${a} + ${b} = ?`; correct = a + b;
      }
      return { q, correct: String(correct), w1: String(correct + rand(1,5)), w2: String(correct - rand(1,5)), w3: String(correct + rand(6,10)), subject: 'sansu', grade: grade };
    };

    const AI_THEMES = ["日常", "動物", "科学", "スポーツ", "歴史"];

    const generateQuestionWithAI = async (subjectName, gradeName, historyList = [], isChallenge = false) => {
      if (!geminiApiKey) return null;

      // ★ お客様の指摘通り、勝手に変更していたモデルを元の gemini-pro に修正しています ★
      const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${geminiApiKey}`;
      
      const historyStr = historyList.slice(-10).join(', ');
      const randomTheme = AI_THEMES[Math.floor(Math.random() * AI_THEMES.length)];
      
      let prompt = `あなたは日本の${gradeName}向けの「${subjectName}」の先生です。
テーマ: 「${randomTheme}」
過去の出題とは被らないように、選択肢4つの学習クイズを1問だけ作成し、指定のJSONフォーマットでのみ出力してください: [${historyStr}]
解答形式は必ず次のJSON文字列のみにしてください。
{"q":"問題文","correct":"正解","w1":"間違い1","w2":"間違い2","w3":"間違い3"}`;

      try {
        const response = await fetch(apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });
        
        if (!response.ok) return null;

        const result = await response.json();
        if (result.candidates && result.candidates.length > 0) {
          const rawText = result.candidates[0].content.parts[0].text;
          const jsonMatch = rawText.match(/\{[\s\S]*?\}/);
          if (jsonMatch) {
            const parsed = JSON.parse(jsonMatch[0]);
            if (parsed.q && parsed.correct) return parsed;
          }
        }
      } catch (error) {
        console.error("AI Error:", error);
      }
      return null;
    };

    const getLevelData = (totalExp = 0) => {
      let level = 1; let expForNext = 50; let currentBase = 0;
      while (totalExp >= currentBase + expForNext) { currentBase += expForNext; level++; expForNext = Math.floor(expForNext * 1.5); }
      return { level, expForNext, maxHp: 50 + (level - 1) * 20, baseDamage: 10 + (level - 1) * 5 };
    };

    const shuffleArray = (array) => {
      const newArr = [...array];
      for (let i = newArr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [newArr[i], newArr[j]] = [newArr[j], newArr[i]]; }
      return newArr;
    };

    const safeGetEquippedItem = (profile, type) => {
      if (!profile || !profile.equipped || !profile.equipped[type]) return ITEMS[type][0];
      return ITEMS[type].find(i => i.id === profile.equipped[type]) || ITEMS[type][0];
    };

    const safeGetEquippedPet = (profile) => {
      if (!profile || !profile.equipped || !profile.equipped.pet) return PETS[0];
      return PETS.find(p => p.id === profile.equipped.pet) || PETS[0];
    };

    // ==========================================
    // 3. Main App Component
    // ==========================================
    function App() {
      const [view, setView] = useState('title');
      const [profile, setProfile] = useState(null);
      const [battleParams, setBattleParams] = useState(null); 
      const [isLoading, setIsLoading] = useState(true);

      useEffect(() => {
        const loadData = async () => {
          try {
            const savedProfile = localStorage.getItem('studyQuest_profile');
            if (savedProfile) {
              setProfile(sanitizeProfile(JSON.parse(savedProfile)));
            }
          } catch(e) {
            console.error("Load Error", e);
          } finally {
            setIsLoading(false);
          }
        };
        loadData();
      }, []);

      const saveProfile = (newProfile) => {
        const sanitized = sanitizeProfile(newProfile);
        setProfile(sanitized);
        localStorage.setItem('studyQuest_profile', JSON.stringify(sanitized));
      };

      const handleCreateProfile = (name) => {
        saveProfile({ ...INITIAL_PROFILE, name });
        setView('map');
      };

      if (isLoading) return <div className="min-h-screen bg-gray-900 text-white flex items-center justify-center">ロード中...</div>;

      if (view === 'title') return <TitleScreen profile={profile} onStart={() => profile ? setView('map') : setView('create')} />;
      if (view === 'create') return <CreateScreen onSubmit={handleCreateProfile} />;
      if (view === 'shop' && profile) return <ShopScreen profile={profile} saveProfile={saveProfile} onBack={() => setView('map')} />;
      if (view === 'battle' && battleParams && profile) return <BattleScreen profile={profile} saveProfile={saveProfile} params={battleParams} onEnd={() => setView('map')} />;
      if (view === 'map' && profile) return <MapScreen profile={profile} onSelectBattle={(params) => { setBattleParams(params); setView('battle'); }} onShop={() => setView('shop')} onBack={() => setView('title')} />;
      
      return <CreateScreen onSubmit={handleCreateProfile} />;
    }

    function TitleScreen({ profile, onStart }) {
      return (
        <div className="min-h-screen bg-gray-900 flex flex-col items-center justify-center text-white p-4">
          <h1 className="text-5xl font-black mb-12 text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 to-pink-500 text-center">スタディ・クエスト</h1>
          <button onClick={onStart} className="bg-blue-600 text-white text-3xl font-black py-4 px-12 rounded-full shadow-lg hover:bg-blue-500">
            {profile ? 'ぼうけんをつづける' : 'はじめから'}
          </button>
        </div>
      );
    }

    function CreateScreen({ onSubmit }) {
      const [name, setName] = useState('');
      return (
        <div className="min-h-screen bg-indigo-900 flex flex-col items-center justify-center p-4">
          <div className="bg-white rounded-3xl p-8 w-full max-w-md text-center">
            <h2 className="text-2xl font-black text-gray-800 mb-6">きみのなまえは？</h2>
            <input type="text" value={name} onChange={(e) => setName(e.target.value)} className="w-full border-4 border-gray-300 rounded-xl p-4 text-2xl mb-6 text-gray-800" placeholder="なまえ" />
            <button onClick={() => name.trim() && onSubmit(name)} className="w-full bg-green-500 text-white font-black text-2xl py-4 rounded-xl">けってい！</button>
          </div>
        </div>
      );
    }

    function MapScreen({ profile, onSelectBattle, onShop, onBack }) {
      const levelData = getLevelData(profile?.exp || 0);
      const [selectedSubject, setSelectedSubject] = useState(null);

      return (
        <div className="min-h-screen bg-green-50 flex flex-col pb-20">
          <div className="bg-white p-4 shadow-md flex justify-between items-center z-10">
            <div className="font-black text-gray-800 text-lg">{profile.name} (Lv.{levelData.level})</div>
            <div className="flex items-center gap-4">
              <span className="font-black text-yellow-600">🪙 {profile.coins}</span>
              <button onClick={onBack} className="text-gray-400 font-black">✕</button>
            </div>
          </div>

          <div className="flex-1 p-4 max-w-md mx-auto w-full flex flex-col justify-center">
            {!selectedSubject ? (
              <div className="grid grid-cols-2 gap-4">
                {SUBJECTS.map(subj => (
                  <button key={subj.id} onClick={() => setSelectedSubject(subj.id)} className={`${subj.color} text-white rounded-3xl p-6 font-black text-2xl`}>
                    {subj.icon} {subj.name}
                  </button>
                ))}
              </div>
            ) : (
              <div className="bg-white rounded-3xl p-4 shadow-lg relative">
                <button onClick={() => setSelectedSubject(null)} className="absolute -top-4 -left-2 bg-gray-800 text-white w-10 h-10 rounded-full font-black">◀</button>
                <div className="text-center font-black text-2xl mb-4 text-blue-600">{SUBJECTS.find(s=>s.id===selectedSubject).name}</div>
                <div className="flex flex-col gap-3">
                  {GRADES.map(grade => (
                    <button key={grade.id} onClick={() => onSelectBattle({ subject: selectedSubject, grade: grade })} className="bg-gray-50 border p-4 rounded-xl font-black text-gray-800">
                      {grade.name}
                    </button>
                  ))}
                </div>
              </div>
            )}
          </div>

          <div className="fixed bottom-0 left-0 right-0 bg-white border-t flex justify-around p-4 z-50">
            <button className="text-blue-600 font-bold">🗺️ マップ</button>
            <button onClick={onShop} className="text-gray-400 font-bold">🏪 ショップ</button>
          </div>
        </div>
      );
    }

    function ShopScreen({ profile, saveProfile, onBack }) {
      return (
        <div className="min-h-screen bg-orange-50 p-4 pb-24">
          <div className="flex justify-between items-center mb-6">
            <button onClick={onBack} className="bg-white p-2 rounded-full font-black px-4 shadow">◀ もどる</button>
            <div className="font-black text-yellow-600">🪙 {profile.coins}</div>
          </div>
          <div className="bg-white rounded-3xl p-6 text-center font-black text-gray-700">ガチャ機能などのショップ画面です</div>
        </div>
      );
    }

    function BattleScreen({ profile, saveProfile, params, onEnd }) {
      const [phase, setPhase] = useState('intro');
      const [enemy, setEnemy] = useState(MONSTERS[0]);
      const [enemyHp, setEnemyHp] = useState(30);
      const [currentQ, setCurrentQ] = useState(null);
      const [options, setOptions] = useState([]);
      const [askedQuestions, setAskedQuestions] = useState([]);
      
      const questionQueueRef = useRef([]);

      const loadNextQuestion = async () => {
        if (questionQueueRef.current.length > 0) {
          const q = questionQueueRef.current.shift();
          setCurrentQ(q);
          setOptions(shuffleArray([{text: q.correct, ok: true}, {text: q.w1, ok: false}, {text: q.w2, ok: false}, {text: q.w3, ok: false}]));
          prefetchQuestion();
          return;
        }
        
        const subj = SUBJECTS.find(s => s.id === params.subject);
        const grade = GRADES.find(g => g.id === params.grade.id);
        const aiQ = await generateQuestionWithAI(subj.name, grade.name, askedQuestions);
        const q = aiQ || generateMathQuestion(grade.id);
        
        setCurrentQ(q);
        setOptions(shuffleArray([{text: q.correct, ok: true}, {text: q.w1, ok: false}, {text: q.w2, ok: false}, {text: q.w3, ok: false}]));
        setAskedQuestions(prev => [...prev, q.q]);
        prefetchQuestion();
      };

      const prefetchQuestion = async () => {
        const subj = SUBJECTS.find(s => s.id === params.subject);
        const grade = GRADES.find(g => g.id === params.grade.id);
        const aiQ = await generateQuestionWithAI(subj.name, grade.name, askedQuestions);
        if (aiQ) questionQueueRef.current.push(aiQ);
      };

      useEffect(() => {
        const e = MONSTERS[Math.floor(Math.random() * MONSTERS.length)];
        setEnemy(e);
        setEnemyHp(e.hp);
        setTimeout(() => { loadNextQuestion(); setPhase('question'); }, 1000);
      }, []);

      const handleAnswer = (opt) => {
        if (opt.ok) {
          const dmg = 15;
          const newHp = Math.max(0, enemyHp - dmg);
          setEnemyHp(newHp);
          if (newHp <= 0) {
            setPhase('clear');
            saveProfile({ ...profile, exp: profile.exp + 20, coins: profile.coins + 15 });
          } else {
            loadNextQuestion();
          }
        }
      };

      if (phase === 'intro') return <div className="fixed inset-0 bg-black flex items-center justify-center text-white text-4xl font-black">バトル開始！</div>;

      return (
        <div className="fixed inset-0 bg-gray-900 text-white flex flex-col justify-between p-4">
          <div className="flex flex-col items-center">
            <div className="text-xl font-bold">{enemy.name} (HP: {enemyHp})</div>
            <img src={enemy.img} className="w-40 h-40 object-contain my-4" />
          </div>

          <div className="bg-white text-gray-900 rounded-3xl p-6">
            {phase === 'question' && currentQ && (
              <div>
                <h3 className="text-xl font-black mb-4 text-center">{currentQ.q}</h3>
                <div className="grid grid-cols-2 gap-3">
                  {options.map((opt, i) => (
                    <button key={i} onClick={() => handleAnswer(opt)} className="bg-gray-100 p-4 rounded-xl font-bold">{opt.text}</button>
                  ))}
                </div>
              </div>
            )}
            {phase === 'clear' && (
              <div className="text-center">
                <h2 className="text-3xl font-black text-yellow-500 mb-4">勝利！</h2>
                <button onClick={onEnd} className="bg-yellow-500 text-white font-black px-6 py-3 rounded-xl">マップへ</button>
              </div>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
